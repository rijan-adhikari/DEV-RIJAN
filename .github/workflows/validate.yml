name: Validate portfolio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check data.js
          node --check admin/admin.js
          node --check js/contact-form.js
      - name: Test server, forced password change, content API and inbox
        run: |
          DATA_DIR="$RUNNER_TEMP/portfolio-data" PORT=4173 node server.js > "$RUNNER_TEMP/portfolio.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/api/health | grep -q '"status":"ok"'
          curl -fsS -c "$RUNNER_TEMP/cookies" -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin"}' http://127.0.0.1:4173/api/admin/login | grep -q '"mustChangePassword":true'
          STATUS=$(curl -sS -o "$RUNNER_TEMP/guard.json" -w '%{http_code}' -b "$RUNNER_TEMP/cookies" http://127.0.0.1:4173/api/admin/data)
          test "$STATUS" = "403"
          curl -fsS -b "$RUNNER_TEMP/cookies" -c "$RUNNER_TEMP/cookies" -X PUT -H 'Content-Type: application/json' -d '{"currentPassword":"admin","username":"owner","newPassword":"A-Strong-Test-Password-2026"}' http://127.0.0.1:4173/api/admin/password | grep -q '"success":true'
          curl -fsS -b "$RUNNER_TEMP/cookies" http://127.0.0.1:4173/api/admin/data | grep -q '"projects"'
          curl -fsS -H 'Content-Type: application/json' -d '{"name":"CI Test","email":"ci@example.com","subject":"Smoke test","message":"This is an automated contact form test."}' http://127.0.0.1:4173/api/contact | grep -q '"success":true'
          curl -fsS -b "$RUNNER_TEMP/cookies" http://127.0.0.1:4173/api/admin/messages | grep -q 'Automated contact form test'
