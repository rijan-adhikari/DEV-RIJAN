name: Validate portfolio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check server.js
          node --check data.js
          for file in js/*.js; do node --check "$file"; done
      - name: Test public site and contact endpoint
        run: |
          DATA_DIR="$RUNNER_TEMP/portfolio-data" PORT=4173 node server.js > "$RUNNER_TEMP/portfolio.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/api/health >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/api/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:4173/ | grep -q 'Rijan Adhikari'
          curl -fsS http://127.0.0.1:4173/data.js | grep -q 'SITE_DATA'
          STATUS=$(curl -sS -o "$RUNNER_TEMP/admin.json" -w '%{http_code}' http://127.0.0.1:4173/api/admin/data)
          test "$STATUS" = "404"
          STATUS=$(curl -sS -o "$RUNNER_TEMP/admin-page.txt" -w '%{http_code}' http://127.0.0.1:4173/admin)
          test "$STATUS" = "404"
          curl -fsS -H 'Content-Type: application/json' -d '{"name":"CI Test","email":"ci@example.com","subject":"Smoke test","message":"This is an automated contact form test."}' http://127.0.0.1:4173/api/contact | grep -q '"success":true'
